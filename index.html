<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collecte de Fonds - Jeunes d'Ambohimalaza</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Intercepter et masquer silencieusement l'avertissement de licence PrimeUI
        var origWarn = console.warn;
        console.warn = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('[PrimeUI]') !== -1) {
            return;
          }
          return origWarn.apply(console, arguments);
        };

        var origError = console.error;
        console.error = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('[PrimeUI]') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };

        var dummy = document.createElement('div');
        dummy.id = 'p-license-host';
        dummy.style.cssText = 'display:none!important;visibility:hidden!important;position:absolute!important;width:0!important;height:0!important;pointer-events:none!important;';
        document.documentElement.appendChild(dummy);

        // Mode clair (light mode) par défaut
        try {
          var savedTheme = localStorage.getItem('collecte_theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (!savedTheme) {
              localStorage.setItem('collecte_theme', 'light');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
